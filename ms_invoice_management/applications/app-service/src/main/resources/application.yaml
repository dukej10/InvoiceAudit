server:
  port: 8080
spring:
  application:
    name: "InvoiceManagement"
  devtools:
    add-properties: false
  webflux:
    base-path: "/ms_invoice_management"
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: "${ENV:local}"

security:
  jwt:
    secret: "${JWT_SECRET:Rk1LZ1V2R2R0M1Z1U1h4Z25Jb0h1dE1qQ3NPSk1vZ3ZkR0h6c1E=}"
    expiration: 3600000
management:
  adapters:
    postgresql:
      schema: "${DB_POSTGRES_SCHEMA:public}"
      initial-size: 10
      max-size: 20
      max-idle-time: 30
      max-replicas: 1
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
aws:
  region: "${AWS_REGION:us-east-1}"
  secrets-manager:
    secrets:
      secret-postgresql: "${AWS_SECRET_POSTGRESQL:invoice-management-db-secret}"
      secret-rabbitmq: "${AWS_SECRET_RABBITMQ:invoice-management-sender-rabbitmq-secret}"
    config:
      endpoint: "${AWS_ENDPOINT:http://localhost:4566}"
      cacheSize: "${AWS_CACHE_SIZE:1000}"
      cacheTime: "${AWS_CACHE_TIME:3600}"