server:
  port: 8081
spring:
  application:
    name: "CreditManagement"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: "${ENV:local}"
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
aws:
  region: "${AWS_REGION:us-east-1}"
  dynamodb:
    endpoint: "${AWS_DYNAMODB_ENDPOINT:http://localhost:8000}"
  secrets-manager:
    secrets:
      secret-dynamodb: "${AWS_SECRET_DYNAMODB:invoice-management-dynamodb-secret}"
      secret-rabbitmq: "${AWS_SECRET_RABBITMQ:invoice-management-receiver-rabbitmq-secret}"
    config:
      endpoint: "${AWS_ENDPOINT:http://localhost:4566}"
      cacheSize: "${AWS_CACHE_SIZE:1000}"
      cacheTime: "${AWS_CACHE_TIME:3600}"
rabbitmq:
  queue: "${RABBITMQ_QUEUE:audit-queue}"
